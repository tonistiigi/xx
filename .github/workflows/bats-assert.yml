name: bats-assert

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/bats-assert.yml'
      - 'util/bats-assert/**'
      - 'docker-bake.hcl'
  pull_request:
    paths:
      - '.github/workflows/bats-assert.yml'
      - 'util/bats-assert/**'
      - 'docker-bake.hcl'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to DockerHub
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      -
        name: Test
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: "{{defaultContext}}:util/bats-assert"
          targets: test
      -
        name: Publish
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: "{{defaultContext}}:util/bats-assert"
          targets: all
          push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
